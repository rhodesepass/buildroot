# rootfs 分区(0x700000~0x2300000, 28MiB)整个是一个 UBI 设备, 单卷:
#   rootfs  只读系统卷(overlay lower), 24MiB = 199 LEB(126976)
# overlay 化后系统卷运行时零增长(写入全进 data 分区的 upper),
# 只随固件版本变大(当前 ~11M); 超出会在构建时报错, 刷不坏设备。
# overlay upper 在独立的 data MTD 分区(0x2300000~0x8000000, 93MiB)上,
# 不在此镜像内 -- DFU "rootfs partubi 4" 只重写系统, 刷机保数据;
# data 分区的 UBI/卷由 preinit 首启或损坏时用 ubiformat/ubimkvol 重建。
[rootfs]
mode=ubi
image=rootfs_ubifs.img
vol_id=0
vol_type=dynamic
vol_name=rootfs
vol_size=25165824
vol_alignment=1
